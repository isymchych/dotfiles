[main]
include=~/.config/mb-clipboard/light-theme.ini
dpi-aware=no
font=Iosevka Term Semibold:size=16
width=100
lines=20
image-size-ratio=0.6
line-height=32
horizontal-pad=20
vertical-pad=12
inner-pad=6

[border]
width=2
radius=8
selection-radius=4

[key-bindings]
expunge=none
custom-1=Control+s
custom-2=Shift+Delete
custom-3=Control+t
custom-4=Control+Shift+t
